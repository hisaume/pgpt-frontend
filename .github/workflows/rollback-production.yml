name: Rollback Production Frontend

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID containing the production artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  rollback-production:
    uses: ./.github/workflows/rollback-env.yml
    with:
      environment: production
      run_id: ${{ inputs.run_id }}
